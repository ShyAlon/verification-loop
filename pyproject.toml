[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verification-loop"
description = "Deterministic-first verification: does the build match the spec? Founder-side test execution, embeddings traceability, AST/Semgrep, schema conformance, LLM judges only the semantic residue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts==0.29.0",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
]

[project.scripts]
verify-bundle = "verification_loop.cli:main"

[project.optional-dependencies]
llm = ["langchain-openai>=0.2", "langchain-core>=0.3"]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/verification_loop/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/verification_loop"]



# Exact public contracts snapshot; no cross-repository credentials at install.
[tool.uv.sources]
vmodel-contracts = { path = "vendor/vmodel_contracts-0.29.0-py3-none-any.whl" }
