[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verification-loop"
description = "Deterministic-first verification: does the build match the spec? Founder-side test execution, embeddings traceability, AST/Semgrep, schema conformance, LLM judges only the semantic residue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts @ git+https://github.com/ShyAlon/vmodel-contracts.git@b9fbc33d1b02c04b7327a95d733b94b90cb0d25d",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
]

[project.scripts]
verify-bundle = "verification_loop.cli:main"

[project.optional-dependencies]
llm = ["langchain-openai>=0.2", "langchain-core>=0.3"]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/verification_loop/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/verification_loop"]


